project:
  type: default
  output-dir: _site
format:
  html:
    theme: [cosmo, notes.scss]
    toc: true
    toc-depth: 3
    toc-title: "In these notes"
    toc-location: left
    number-sections: false
    html-math-method: mathml
    embed-resources: true
    smooth-scroll: true
    anchor-sections: true
    lang: en
    fig-cap-location: bottom
    tbl-cap-location: top
