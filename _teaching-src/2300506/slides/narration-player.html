<!-- Narration and captions for 2300506 decks (adapted from the 2105315 player, English only).
     Reads the narration index built by build_narration.py: per slide, the sentences and one MP3 with
     one cue per sentence. publish.py also inlines the index into the page (script#nr-data), so the
     deck works when opened from a downloaded folder, where fetch() of a local file is blocked.
     Controls at the bottom left:
       Narration: off / on      Pause or Resume, Replay slide (while narration is on)
       Captions:  off / on      Auto-advance: off / on
     With narration off and captions on, the slide's full narration text is shown to read.
     Settings are remembered in this browser (keys nr506-*). -->
<style>
.nr-bar { position: fixed; left: 12px; bottom: 10px; z-index: 40; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 120px); font: 600 14px/1 "Source Sans 3", sans-serif; }
.nr-bar button { border: 1.5px solid #0F6E6B; background: #fff; color: #0F6E6B; border-radius: 4px; padding: 8px 12px; cursor: pointer; font: inherit; }
.nr-bar button[aria-pressed="true"] { background: #0F6E6B; border-color: #0F6E6B; color: #fff; }
.nr-bar button:focus-visible { outline: 2px solid #E29A2D; outline-offset: 2px; }
/* When captions show, the slide area shrinks by --cc-band so captions never cover slide text. */
.reveal { height: calc(100% - var(--cc-band, 0px)) !important; }
.nr-caption { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 39; width: min(1100px, 92vw); max-height: 22vh; overflow-y: auto;
  background: rgba(28,36,43,.92); color: #fff; border-radius: 4px; padding: 10px 16px; font: 400 21px/1.45 "Source Sans 3", sans-serif; text-align: center; }
.nr-caption.transcript { text-align: left; font-size: 18px; }
.nr-caption.transcript p { margin: 0 0 .4em; }
.nr-home { align-self: center; margin-left: 8px; font: 400 12px/1 "Source Sans 3", sans-serif; color: #66727C !important; text-decoration: none; }
.nr-home:hover { text-decoration: underline; }
@media (max-width: 700px) { .nr-bar { font-size: 12px; } .nr-bar button { padding: 6px 8px; } .nr-caption { font-size: 17px; bottom: 92px; } .nr-home { display: none; } }
@media print { .nr-bar, .nr-caption { display: none !important; } }
</style>
<div class="nr-bar" role="toolbar" aria-label="Narration and captions">
  <button type="button" id="nr-sound" aria-pressed="false">Narration: off</button>
  <button type="button" id="nr-pause" hidden>Pause</button>
  <button type="button" id="nr-replay" hidden>Replay slide</button>
  <button type="button" id="nr-cc" aria-pressed="false">Captions: off</button>
  <button type="button" id="nr-auto" aria-pressed="false">Auto-advance: off</button>
  <a class="nr-home" href="../../../index.html">2300506 course page</a>
</div>
<div class="nr-caption" id="nr-caption" aria-live="polite" hidden></div>
<script>
(function () {
  const deck = location.pathname.split('/').pop().replace(/\.html$/, '') || 'index';
  const store = { get(k, d) { try { return localStorage.getItem('nr506-' + k) ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem('nr506-' + k, v); } catch {} } };
  const state = { sound: store.get('sound', 'off') === 'en' ? 'en' : 'off',
                  cc: store.get('cc', 'off') === 'en' ? 'en' : 'off',
                  auto: store.get('auto', 'off') === 'on' };
  const audio = new Audio(); audio.preload = 'auto';
  const box = document.getElementById('nr-caption');
  const $ = (id) => document.getElementById(id);
  let data = {}, slide = null, band = -1;

  function setBand() {
    const h = box.hidden ? 0 : box.offsetHeight + 64;
    if (h === band) return;
    band = h;
    document.documentElement.style.setProperty('--cc-band', h + 'px');
    if (window.Reveal && Reveal.isReady()) Reveal.layout();
  }
  new ResizeObserver(setBand).observe(box);

  const on = () => state.sound === 'en';
  function paintButtons() {
    $('nr-sound').textContent = on() ? 'Narration: on' : 'Narration: off'; $('nr-sound').setAttribute('aria-pressed', on());
    $('nr-pause').hidden = !on(); $('nr-replay').hidden = !on();
    $('nr-pause').textContent = audio.paused && audio.currentTime > 0 && !audio.ended ? 'Resume' : 'Pause';
    $('nr-cc').textContent = state.cc === 'en' ? 'Captions: on' : 'Captions: off'; $('nr-cc').setAttribute('aria-pressed', state.cc === 'en');
    $('nr-auto').textContent = 'Auto-advance: ' + (state.auto ? 'on' : 'off'); $('nr-auto').setAttribute('aria-pressed', state.auto);
  }
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function show(html, transcript) {
    if (state.cc === 'off' || !html) { box.hidden = true; return; }
    box.lang = 'en'; box.classList.toggle('transcript', !!transcript); box.innerHTML = html; box.hidden = false;
  }
  function transcript() {
    const text = slide?.text || [];
    show(text.map((s) => '<p>' + esc(s || '') + '</p>').join(''), true);
  }
  function syncCaption() {
    const track = slide?.en; if (!track) return;
    const t = audio.currentTime;
    const i = track.cues.findIndex(([a, b]) => t >= a && t < b + 0.3);
    if (i >= 0) show(esc(slide.text[i] || ''), false);
  }
  function load() {
    const id = Reveal.getCurrentSlide()?.id;
    slide = data[id] || null;
    audio.pause();
    if (!slide) { box.hidden = true; return; }
    if (on() && slide.en) {
      audio.src = slide.en.audio; audio.currentTime = 0;
      audio.play().catch((err) => {
        // A newer load interrupts an older play() (AbortError): not a failure. Blocked autoplay: fall back to text.
        if (err && err.name === 'AbortError') return;
        state.sound = 'off'; paintButtons(); transcript();
      });
      box.hidden = true;
    } else transcript();
  }
  audio.addEventListener('play', paintButtons);
  audio.addEventListener('pause', paintButtons);
  audio.addEventListener('timeupdate', () => { if (on()) syncCaption(); });
  // Interactive slides (data-hold) wait for the teacher instead of auto-advancing.
  audio.addEventListener('ended', () => { if (state.auto && !Reveal.isLastSlide() && !Reveal.getCurrentSlide()?.hasAttribute('data-hold')) Reveal.next(); });
  $('nr-pause').addEventListener('click', (e) => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); e.currentTarget.blur(); });
  $('nr-replay').addEventListener('click', (e) => { if (slide) { audio.currentTime = 0; audio.play().catch(() => {}); } e.currentTarget.blur(); });
  $('nr-sound').addEventListener('click', (e) => { state.sound = on() ? 'off' : 'en'; store.set('sound', state.sound); paintButtons(); load(); e.currentTarget.blur(); });
  $('nr-cc').addEventListener('click', (e) => {
    state.cc = state.cc === 'en' ? 'off' : 'en'; store.set('cc', state.cc); paintButtons();
    if (on() && !audio.paused) syncCaption(); else if (on()) box.hidden = true; else transcript();
    e.currentTarget.blur();
  });
  $('nr-auto').addEventListener('click', (e) => { state.auto = !state.auto; store.set('auto', state.auto ? 'on' : 'off'); paintButtons(); e.currentTarget.blur(); });

  function start(d) {
    data = d || {};
    if (!Object.keys(data).length) { document.querySelector('.nr-bar').hidden = true; return; }
    paintButtons();
    if (Reveal.isReady()) load(); else Reveal.on('ready', load);
    Reveal.on('slidechanged', load);
  }
  paintButtons();
  // The inlined index sits after this script in the page, so read it once the page is parsed.
  function boot() {
    const inline = document.getElementById('nr-data');
    if (inline) { try { start(JSON.parse(inline.textContent)); return; } catch (e) {} }
    fetch('narration/' + deck + '.json', { cache: 'no-cache' }).then((r) => r.ok ? r.json() : {}).then(start)
      .catch(() => { document.querySelector('.nr-bar').hidden = true; });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
